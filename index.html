<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryonex Network | Kış Teması</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background-color: #0b0c10; color: white; overflow-x: hidden; }

        /* Hareketli Kar Efekti Arka Planı */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, #000428, #004e92); /* Gece mavisi kış gökyüzü */
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 { font-size: 4rem; text-shadow: 0 0 20px #66fcf1; }

        .ip-box {
            margin-top: 20px;
            padding: 15px 40px;
            border: 2px dashed #66fcf1;
            border-radius: 50px;
            cursor: pointer;
            background: rgba(102, 252, 241, 0.1);
            transition: 0.3s;
        }

        .ip-box:hover { background: #66fcf1; color: black; }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <div class="hero">
        <h1>CRYONEX NETWORK</h1>
        <p>Kış Temalı Survival Deneyimi Başladı!</p>
        <div class="ip-box" onclick="copyIP()">
            <b id="server-ip">play.cryonex.com</b>
        </div>
    </div>

    <script>
        // Kar Yağdırma Sistemi (JavaScript)
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, snowflakes = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            snowflakes = [];
            for (let i = 0; i < 150; i++) {
                snowflakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 4 + 1,
                    d: Math.random() * 1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "white";
            ctx.beginPath();
            for (let i = 0; i < snowflakes.length; i++) {
                let p = snowflakes[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            move();
        }

        function move() {
            for (let i = 0; i < snowflakes.length; i++) {
                let p = snowflakes[i];
                p.y += Math.pow(p.d, 2) + 1;
                if (p.y > height) {
                    snowflakes[i] = { x: Math.random() * width, y: 0, r: p.r, d: p.d };
                }
            }
        }

        window.addEventListener('resize', init);
        init();
        setInterval(draw, 30);

        function copyIP() {
            const ip = document.getElementById('server-ip').innerText;
            navigator.clipboard.writeText(ip);
            alert("IP Adresi Kopyalandı!");
        }
    </script>
</body>
</html>
