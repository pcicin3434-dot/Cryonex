<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selam Timuçin</title>
    <style>
        /* CSS BÖLÜMÜ */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Arka Plan Görseli */
        .minecraft-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            object-fit: cover;
            /* Minecraft atmosferi için hafif bulanıklık */
            filter: brightness(0.6);
        }

        /* Kar Efekti Katmanı */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Merkezdeki Cam Pencere */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        .glass-window {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            width: 450px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            animation: slideUp 1.5s ease-out;
        }

        /* Pencere Üstündeki Renkli Noktalar (Mac stili) */
        .dots {
            display: flex;
            gap: 7px;
            position: absolute;
            top: 15px;
            left: 20px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        h1 {
            font-size: 3rem;
            margin: 10px 0;
            letter-spacing: 2px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.1rem;
            opacity: 0.8;
            font-weight: 300;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <img class="minecraft-bg" src="https://wallpaperaccess.com/full/1324831.jpg" alt="Minecraft">

    <canvas id="snow-canvas"></canvas>

    <div class="container">
        <div class="glass-window">
            <div class="dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <h1>Selam Timuçin</h1>
            <p>Sistemler hazır. Kış geldi.</p>
        </div>
    </div>

    <script>
        // JAVASCRIPT BÖLÜMÜ (Kar Efekti)
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let w, h;

        function setCanvasSize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
        }

        window.addEventListener('resize', setCanvasSize);
        setCanvasSize();

        function createParticles() {
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 3 + 1,
                    speed: Math.random() * 1 + 0.5,
                    opacity: Math.random() * 0.8
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'white';
            
            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            updateParticles();
        }

        function updateParticles() {
            particles.forEach(p => {
                p.y += p.speed;
                // Hafif rüzgar efekti
                p.x += Math.sin(p.y / 50) * 0.5;

                if (p.y > h) {
                    p.y = -10;
                    p.x = Math.random() * w;
                }
            });
        }

        function animate() {
            drawParticles();
            requestAnimationFrame(animate);
        }

        createParticles();
        animate();
    </script>
</body>
</html>
