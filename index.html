<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryonex Network | Mağaza ve Başvuru</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0c10; color: white; overflow-x: hidden; scroll-behavior: smooth; }

        /* Kar Arka Planı */
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(to bottom, #000428, #004e92); }

        /* Navigasyon */
        nav { position: fixed; top: 0; width: 100%; padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #66fcf1; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; cursor: pointer; }

        /* Hero */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 4rem; text-shadow: 0 0 20px #66fcf1; }
        
        /* Modal (Pencereler) */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #1f2833; margin: 10% auto; padding: 30px; border-radius: 20px; width: 80%; max-width: 600px; border: 2px solid #66fcf1; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 28px; cursor: pointer; color: #66fcf1; }

        /* Mağaza Kartları */
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 20px; }
        .item-card { background: #0b0c10; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #45a29e; }
        .btn-buy { background: #66fcf1; color: black; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }

        /* Ödeme Formu */
        .payment-form input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        
        /* Başvuru Formu */
        .apply-form textarea { width: 100%; height: 100px; padding: 10px; margin-top: 10px; border-radius: 5px; }

        .ip-box { padding: 15px 40px; border: 2px dashed #66fcf1; border-radius: 50px; cursor: pointer; background: rgba(102, 252, 241, 0.1); margin-top: 20px; }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <nav>
        <div class="logo">Cryonex</div>
        <div class="nav-links">
            <a onclick="location.reload()">Ana Sayfa</a>
            <a onclick="openModal('shopModal')">Mağaza</a>
            <a onclick="openModal('applyModal')">Helper Başvuru</a>
        </div>
    </nav>

    <div class="hero">
        <h1>CRYONEX NETWORK</h1>
        <div class="ip-box" onclick="alert('IP Kopyalandı!')">play.cryonex.com</div>
    </div>

    <div id="shopModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('shopModal')">&times;</span>
            <h2 style="color:#66fcf1">Cryonex Market</h2>
            <div class="shop-grid">
                <div class="item-card">
                    <h3>VIP</h3>
                    <p>25 TL</p>
                    <button class="btn-buy" onclick="openModal('payModal')">Satın Al</button>
                </div>
                <div class="item-card">
                    <h3>MVP+</h3>
                    <p>50 TL</p>
                    <button class="btn-buy" onclick="openModal('payModal')">Satın Al</button>
                </div>
            </div>
        </div>
    </div>

    <div id="payModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('payModal')">&times;</span>
            <h2 style="color:#66fcf1">Kredi Kartı Ödeme</h2>
            <form class="payment-form" onsubmit="alert('Ödeme Başarılı!'); return false;">
                <input type="text" placeholder="Kart Üzerindeki İsim" required>
                <input type="text" placeholder="**** **** **** ****" required>
                <div style="display:flex; gap:10px;">
                    <input type="text" placeholder="AA/YY" required>
                    <input type="text" placeholder="CVV" required>
                </div>
                <button class="btn-buy" type="submit">25/50 TL Öde</button>
            </form>
        </div>
    </div>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('applyModal')">&times;</span>
            <h2 style="color:#66fcf1">Helper Başvuru Formu</h2>
            <form class="apply-form" onsubmit="alert('Başvurunuz Alındı!'); return false;">
                <input type="text" placeholder="Oyun İçi Adınız" style="width:100%; padding:10px; margin-top:10px;" required>
                <input type="email" placeholder="E-posta Adresiniz" style="width:100%; padding:10px; margin-top:10px;" required>
                <textarea placeholder="Neden sizi seçmeliyiz? Deneyimlerinizden bahsedin..."></textarea>
                <button class="btn-buy" type="submit">Başvuruyu Gönder</button>
            </form>
        </div>
    </div>

    <script>
        // Modal Kontrol Fonksiyonları
        function openModal(id) { document.getElementById(id).style.display = "block"; }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        // Kar Efekti (Hızlı Versiyon)
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, snowflakes = [];
        function init() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            for (let i = 0; i < 100; i++) snowflakes.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 3 + 1, d: Math.random() * 1 });
        }
        function draw() {
            ctx.clearRect(0, 0, width, height); ctx.fillStyle = "white"; ctx.beginPath();
            for (let i = 0; i < snowflakes.length; i++) {
                let p = snowflakes[i]; ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
                p.y += p.d + 1; if (p.y > height) snowflakes[i].y = 0;
            }
            ctx.fill();
        }
        init(); setInterval(draw, 30);
    </script>
</body>
</html>
