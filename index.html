<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>cryonex launcher eğlenceler sunar!</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .container { display: flex; justify-content: center; align-items: center; height: 100vh; position: relative; z-index: 2; }
        .window { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(15px); padding: 45px; border-radius: 25px; text-align: center; color: white; border: 1px solid rgba(255,255,255,0.1); width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        h1 { font-size: 2.2rem; margin-bottom: 5px; }
        p { opacity: 0.6; margin-bottom: 30px; font-size: 0.9rem; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: block; padding: 14px; border-radius: 10px; font-weight: bold; text-decoration: none; transition: 0.3s; text-transform: uppercase; }
        .btn-mc { background: #2e7d32; color: white; box-shadow: 0 4px #1b5e20; }
        .btn-mc:hover { background: #388e3c; transform: scale(1.03); }
        .btn-dc { background: #5865F2; color: white; font-size: 0.85rem; }
        .btn-dc:hover { background: #4752c4; opacity: 0.9; }
    </style>
</head>
<body>
    <canvas id="snow"></canvas>
    <div class="container">
        <div class="window">
            <h1>oynamak için aşağıdaki butona tıkla!</h1>
            <p>by asia...</p>
            <div class="btn-group">
                <a href="mc.html" class="btn btn-mc">MİNECRAFT'I BAŞLAT</a>
                <a href="https://discord.gg/Ce2xfeHE" target="_blank" class="btn btn-dc">Discord'a Katıl</a>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 120; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 3 + 1, s: Math.random() * 1 + 0.5 });
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            for (let p of particles) { ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); }
            ctx.fill(); update();
        }
        function update() {
            for (let p of particles) { p.y += p.s; if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; } }
        }
        window.addEventListener('resize', init);
        init(); setInterval(draw, 30);
    </script>
</body>
</html>
