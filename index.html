<div id="shopModal" class="modal">
    <div class="modal-content" style="max-width: 900px; background: #f8f9fa; color: #333;">
        <span class="close" onclick="closeModal('shopModal')" style="color: #333;">&times;</span>
        
        <div id="category-view">
            <h2 style="margin-bottom: 25px; text-align: left; font-weight: 700;">Kategoriler</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;">
                
                <div class="shop-card" onclick="showPackages('vip-list')" style="background: linear-gradient(135deg, #ffd700, #b8860b);">
                    <i class="fa fa-crown" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <h3>VİPLER</h3>
                </div>

                <div class="shop-card" style="background: linear-gradient(135deg, #2ecc71, #27ae60);">
                    <i class="fa fa-cubes" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <h3>SPAWNERLAR</h3>
                </div>

                <div class="shop-card" style="background: linear-gradient(135deg, #3498db, #2980b9);">
                    <i class="fa fa-key" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <h3>ANAHTARLAR</h3>
                </div>

                <div class="shop-card" style="background: linear-gradient(135deg, #e67e22, #d35400);">
                    <i class="fa fa-box-open" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <h3>EŞYA PAKETLERİ</h3>
                </div>
            </div>
        </div>

        <div id="vip-list" style="display: none;">
            <button onclick="backToCategories()" style="border:none; background:none; color:#ff4757; cursor:pointer; font-weight:bold; margin-bottom:20px;">
                <i class="fa fa-arrow-left"></i> Kategorilere Dön
            </button>
            <h2 style="margin-bottom: 20px;">VIP Paketleri</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="package-item"><span>VIP (3 Günlük)</span> <b>25 TL</b> <button class="buy-small">Satın Al</button></div>
                <div class="package-item"><span>VIP (1 Haftalık)</span> <b>30 TL</b> <button class="buy-small">Satın Al</button></div>
                <div class="package-item" style="border-color:#ff4757"><span>MVP+ (3 Günlük)</span> <b>50 TL</b> <button class="buy-small" style="background:#ff4757">Satın Al</button></div>
                <div class="package-item" style="border-color:#ff4757"><span>MVP+ (1 Haftalık)</span> <b>80 TL</b> <button class="buy-small" style="background:#ff4757">Satın Al</button></div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Yeni Mağaza Tasarımı CSS */
    .shop-card {
        padding: 30px;
        border-radius: 15px;
        color: white;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .shop-card:hover { transform: translateY(-5px); filter: brightness(1.1); }
    .shop-card h3 { font-size: 0.9rem; letter-spacing: 1px; }

    .package-item {
        background: white;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .buy-small {
        padding: 5px 15px;
        background: #2ecc71;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<script>
    // Mağaza Fonksiyonları
    function showPackages(id) {
        document.getElementById('category-view').style.display = 'none';
        document.getElementById(id).style.display = 'block';
    }

    function backToCategories() {
        document.getElementById('category-view').style.display = 'block';
        document.getElementById('vip-list').style.display = 'none';
    }
</script>
